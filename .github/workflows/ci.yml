name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Share links round-trip in a real browser
        run: |
          npx playwright-core install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx wait-on -t 30000 http://localhost:4173/ 2>/dev/null || sleep 5
          npm run share:browser
      - run: node bin/sovereign-draft.js --sample --pdf cabin.pdf --svg cabin.svg --json examples/cabin.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: sheets
          path: |
            cabin.pdf
            cabin.svg
            examples/cabin.json
          retention-days: 14
